name: is_model_vocabulary
description: >-
  The words a call to a language model is described in: a tool's name and
  how it is offered, how hard the model is asked to work, and why it
  stopped. No provider's JSON, and no dart:io.
version: 0.1.0
repository: https://github.com/intersyntactic/model_vocabulary

environment:
  sdk: ^3.13.0

dependencies:
  checked_json: ^0.2.0

dev_dependencies:
  analyzer: ^14.7.0
  lints: ^6.1.0
  test: ^1.33.0
