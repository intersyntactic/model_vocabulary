name: is_model_vocabulary
description: >-
  The words a call to a language model is described in: the tools it is
  offered, the calls it proposes, the turns of the conversation, what it
  replies, and why it stopped. No provider's JSON, and no dart:io.
version: 0.5.0
repository: https://github.com/intersyntactic/model_vocabulary

environment:
  sdk: ^3.13.0

dependencies:
  checked_json: ^0.4.0

dev_dependencies:
  analyzer: ^14.7.0
  lints: ^6.1.0
  test: ^1.33.0
